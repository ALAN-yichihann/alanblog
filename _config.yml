# Hexo 站点配置（hexo-theme-hsad 预览站点）
title: ALAN 的博客
subtitle: '把想说的话，慢慢写下来'
description: '一个安静的示例博客：技术笔记、读书摘记，还有一些没头没尾的瞬间。'
keywords: 技术笔记, 读书, 随笔
author: Alan
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://www.alan-yichihann.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# 代码高亮：主题的“代码框 + 语言标签 + 复制按钮”按 Prism 的输出适配
syntax_highlighter: prismjs
highlight:
  enable: false
prismjs:
  enable: true
  preprocess: true
  line_number: false
  tab_replace: ''

# 首页与归档
index_generator:
  path: ''
  per_page: 6
  order_by: -date

archive_generator:
  enabled: true
  per_page: 20
  yearly: true
  monthly: true
  daily: false

category_generator:
  per_page: 20
  order_by: -date

tag_generator:
  per_page: 20
  order_by: -date

# 站内搜索（主题会把模板换成自己的，用于跳过 hide: true 的文章）
search:
  path: search.xml
  field: post
  content: true
  format: html

theme: hsad
